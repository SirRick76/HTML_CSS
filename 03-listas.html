<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>

<body>
    <h1>Listas em html</h1>
    <h2>Listas não ordenadas</h2>

    <ul type="circle">
        <li>Pão</li>
        <li>Leite</li>
        <li>Ovos</li>

    </ul>

    <!-- ul>li*50 -->
    <!-- ul>li*5>lorem1 -->
    <ul>
        <li>Lorem.</li>
        <li>Perspiciatis?</li>
        <li>Repellendus.</li>
        <li>Fugiat.</li>
        <li>Illo.</li>
    </ul>

    <h2>Listas ordenadas</h2>
    <!-- ol>li*5>lorem1 -->
    <ol type="i">
        <li>Lorem.</li>
        <li>Eaque.
            <ol type="1">
                <li>Lorem.</li>
                <li>Vitae?</li>
            </ol>
        </li>
        <li>Vero.</li>
        <li>Velit!</li>
        <li>Vero.</li>
    </ol>

</body>

</html>
