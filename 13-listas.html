<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas com CSS</title>
    <style>
        body{
            background-color: antiquewhite;
            font-family: Arial, Helvetica, sans-serif;
        }
        ol li{
            color: violet;
            list-style-type:upper-roman;

        }
        ol li::marker{
            color: black;
            font-size: size 1.2em;

        }
        ul li{
            color: blueviolet;
            list-style-type: square;
        }
        ul li::marker{
            color:blue;
            font-size: size 1.2em;
        }
    </style>
</head>
<body>
    <h1>Listas com CSS</h1>
    <h2>Listas ordenadas</h2>
    <ol>
        <li>Lorem.</li>
        <li>Explicabo?</li>
        <li>Eveniet.</li>
        <li>Provident.</li>
    </ol>
    <h2>Listas não ordenadas</h2>
    <ul>
        <li>Lorem.</li>
        <li>Voluptatem.</li>
        <li>Debitis?</li>
        <li>Dignissimos.</li>
    </ul>
    
</body>
</html>
